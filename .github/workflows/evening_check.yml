name: Вечерняя проверка ответов

on:
  schedule:
    - cron: '0 13 * * *'  # 18:00 по Астане (UTC+5)
  workflow_dispatch:

jobs:
  check-replies:
    runs-on: ubuntu-latest

    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v3

      - name: Установить Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Проверить Reply-ответы и продвинуть цикл
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_replies.py

      - name: Сохранить изменения состояния
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json telegram_offset.json
          git diff --staged --quiet || git commit -m "Обновление состояния после проверки ответов"
          git push
